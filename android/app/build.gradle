plugins { id 'com.android.application'; id 'com.chaquo.python' }
android {
    namespace 'local.personal.music.android'
    compileSdk 35
    defaultConfig {
        applicationId 'space.veyww.community'
        minSdk 26
        targetSdk 35
        versionCode 21
        versionName '0.18.4-beta'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
chaquopy { defaultConfig { version = '3.12'; pip { install 'yt-dlp==2026.10.21'; install 'certifi==2026.10.19' } } }
dependencies {
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    testImplementation 'junit:junit:4.13.2'
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.media3:media3-exoplayer:1.5.1'
    implementation 'androidx.media3:media3-session:1.5.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.5.1'
}
